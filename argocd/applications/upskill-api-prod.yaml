apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: upskill-api-prod
  namespace: argocd
spec:
  project: upskill
  source:
    repoURL: https://github.com/Dumberdore/homelab-gitops.git
    targetRevision: main
    path: apps/upskill-api/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: upskill-prod
  syncPolicy:
    syncOptions:
      - PruneLast=true
