apiVersion: batch/v1
kind: Job
metadata:
  name: upskill-api-notify
  labels:
    app.kubernetes.io/name: upskill-api
    app.kubernetes.io/component: notification
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upskill-api
        app.kubernetes.io/component: notification
    spec:
      restartPolicy: Never
      serviceAccountName: upskill-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notify
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "placeholder: deployment completed for ${APP_NAME} in ${ENVIRONMENT}; Slack notification will be wired later"
          envFrom:
            - configMapRef:
                name: upskill-api-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
