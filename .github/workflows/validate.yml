name: Validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Render Kustomize overlays
        run: |
          set -euo pipefail
          kubectl kustomize platform/namespaces >/dev/null
          kubectl kustomize apps/postgres/overlays/dev >/dev/null
          kubectl kustomize apps/postgres/overlays/staging >/dev/null
          kubectl kustomize apps/postgres/overlays/prod >/dev/null
          kubectl kustomize apps/upskill-api/overlays/dev >/dev/null
          kubectl kustomize apps/upskill-api/overlays/staging >/dev/null
          kubectl kustomize apps/upskill-api/overlays/prod >/dev/null
          kubectl kustomize argocd >/dev/null
          kubectl kustomize platform/argocd/bootstrap >/dev/null
